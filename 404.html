<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Page not found · Shared Calendar</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/SharedCalendar/icon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: dark light;
            --bg: light-dark(#f1f1ed, #08080a);
            --ink: light-dark(#111110, #f4f4f1);
            --mute: light-dark(#85857f, #74747a);
            --accent: light-dark(#2b2bff, #c8ff2e);
            --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 1rem;
            padding: 2rem;
            text-align: center;
            background: var(--bg);
            color: var(--ink);
            font: 400 1rem/1.5 var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle, color-mix(in oklab, var(--ink) 20%, transparent) 1.5px, transparent 2px) 0 0 / 28px 28px;
            -webkit-mask: radial-gradient(circle at 50% 50%, #000 10%, transparent 70%);
            mask: radial-gradient(circle at 50% 50%, #000 10%, transparent 70%);
        }

        h1 {
            font: 300 clamp(6rem, 28vw, 15rem)/.85 var(--sans);
            letter-spacing: -.07em;
        }

        h1 span {
            color: var(--accent);
        }

        h2 {
            font: 300 clamp(1.5rem, 4.5vw, 2.2rem)/1.1 var(--sans);
            letter-spacing: -.03em;
        }

        p {
            max-width: 26rem;
            color: var(--mute);
        }

        a {
            margin-top: 1.2rem;
            padding: .95rem 1.8rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 500;
            background: var(--ink);
            color: var(--bg);
            box-shadow: 0 10px 30px #0003;
            transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s;
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px color-mix(in oklab, var(--accent) 40%, transparent);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            a {
                transition: none;
            }
        }
    </style>
    <script>try { const a = JSON.parse(localStorage.prefs).accent; if (a) document.documentElement.style.setProperty('--accent', a); } catch { }</script>
</head>

<body>
    <h1>4<span>0</span>4</h1>
    <h2>This page doesn't exist</h2>
    <!-- <p>Il link potrebbe essere sbagliato, oppure la pagina è stata spostata.</p> -->
    <p>The link may be wrong, or the page may have been moved.</p>
    <a href="/SharedCalendar/">Back</a>
</body>

</html>
